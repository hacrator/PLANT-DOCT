<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7be08a"><title>Plant Doctor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Atkinson+Hyperlegible:wght@400;700&family=Noto+Sans+Devanagari:wght@400;700&display=swap">
<style>
/* Layout: one mobile column in the AgroGard poster style. Camera button first, diagnosis card below. */
:root{--ink:#14141e;--bg:#fff0eb;--card:#ffffff;--red:#ff5a5f;--org:#ff9f43;--yel:#ffe45c;--grn:#7be08a;--blue:#6ea8ff;--mute:#4a4a5a;--dots:#f3d9d2;
--display:"Archivo Black","Arial Black",system-ui,sans-serif;--body:"Atkinson Hyperlegible","Noto Sans Devanagari",system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:17px/1.5 var(--body);margin:0;
background-image:radial-gradient(var(--dots) 1.6px,transparent 1.7px);background-size:36px 36px;
padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.bar{background:var(--grn);border:3px solid var(--ink);border-radius:14px;box-shadow:5px 5px 0 var(--ink);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{font:28px var(--display);margin:0;letter-spacing:.5px}
.tag{background:#fff;border:3px solid var(--ink);border-radius:999px;padding:3px 12px;font-weight:700;font-size:14px;transform:rotate(2deg)}
.card{background:var(--card);border:3px solid var(--ink);border-radius:12px;box-shadow:6px 6px 0 var(--ink);padding:16px;min-width:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.cam{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:var(--red);border:3px solid var(--ink);border-radius:18px;box-shadow:6px 6px 0 var(--ink);min-height:170px;cursor:pointer;font:22px var(--display);text-align:center;padding:16px}
.cam svg{width:64px;height:64px}
.cam:active{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--ink)}
.cam:focus-within,.btn:focus-visible,.lang button:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
.sub{font:400 15px var(--body);margin:0}
.btn{background:var(--yel);border:3px solid var(--ink);border-radius:999px;padding:8px 16px;font:700 15px var(--body);cursor:pointer;color:var(--ink);text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
#pic{width:100%;max-height:300px;object-fit:cover;border:3px solid var(--ink);border-radius:10px;display:block}
.lang{display:flex;gap:0}.lang button{font:700 14px var(--body);border:3px solid var(--ink);background:#fff;padding:5px 14px;cursor:pointer;color:var(--ink)}
.lang button:first-child{border-radius:999px 0 0 999px;border-right-width:1.5px}.lang button:last-child{border-radius:0 999px 999px 0;border-left-width:1.5px}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--yel)}
.name{font:26px/1.15 var(--display);margin:6px 0 2px;text-wrap:balance}
.meta{color:var(--mute);margin:0 0 10px}
.pill{display:inline-block;border:3px solid var(--ink);border-radius:999px;padding:1px 12px;font-weight:700;font-size:14px;margin-right:6px}
h2{font:17px var(--display);margin:16px 0 6px;letter-spacing:.3px}
ul,ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.cure{background:#c9f7e1;border:3px solid var(--ink);border-radius:10px;padding:12px 14px;margin-top:14px}
.cure h2{margin-top:0}
.warn{background:var(--yel);border:3px solid var(--ink);border-radius:10px;padding:10px 14px;font-size:15px}
.spin{width:34px;height:34px;border:5px solid var(--ink);border-top-color:var(--red);border-radius:50%;animation:s 0.9s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.load{display:flex;align-items:center;gap:14px}
small{color:var(--mute);display:block;margin-top:14px;font-size:13px}
</style></head><body>

<main>
  <div class="bar"><h1>Plant Doctor</h1><span class="tag">by AgroGard</span></div>

  <label class="cam" for="shot">
    <svg viewBox="0 0 64 64" fill="none" stroke="#14141e" stroke-width="4" stroke-linejoin="round" aria-hidden="true"><path d="M8 20h12l4-7h16l4 7h12v32H8z" fill="#fff"/><circle cx="32" cy="35" r="10" fill="#ffe45c"/></svg>
    <span id="camTxt">Take photo of sick plant</span>
    <span class="sub" id="camSub">Hold the camera close to the damaged leaf</span>
    <input class="sr" id="shot" type="file" accept="image/*" capture="environment">
  </label>
  <div class="row">
    <label class="btn" for="pick">Choose from gallery</label>
    <input class="sr" id="pick" type="file" accept="image/*">
    <div class="lang" role="group" aria-label="Language"><button id="en" aria-pressed="true">English</button><button id="hi" aria-pressed="false">हिन्दी</button></div>
  </div>

  <div class="warn" id="notice" hidden>Diagnosis is not set up yet. Add the server address in index.html.</div>
  <div class="card" id="out" hidden aria-live="polite"></div>
</main>

<script>
const $=id=>document.getElementById(id);
let sample=null,lang="en",data=null,ctl=null,url=null;
const UI={en:{cam:"Take photo of sick plant",sub:"Hold the camera close to the damaged leaf",again:"Take another photo",
 think:"Checking your plant...",sym:"What I see",cure:"Treatment",prev:"Prevention",expert:"When to ask an expert",
 plant:"Plant",conf:"Confidence",sev:"Severity",note:"This is an AI suggestion from a photo. Check with your local Krishi Vigyan Kendra or agriculture officer before spraying. Follow the pesticide label and wear gloves and a mask.",
 notplant:"I could not see a plant in this photo. Move closer to one leaf and try again.",
 healthy:"Looks healthy",errs:{not_granted:"Allow Claude to analyse photos to use Plant Doctor.",rate_limited:"Too many tries. Wait a minute and try again.",image_rejected:"This photo could not be used. Try another one.",images_unavailable:"Photo analysis is not available here.",def:"Could not check the plant. Check your internet and try again."}},
 hi:{cam:"बीमार पौधे की फोटो लें",sub:"कैमरा खराब पत्ते के पास रखें",again:"दूसरी फोटो लें",
 think:"आपके पौधे की जाँच हो रही है...",sym:"क्या दिख रहा है",cure:"इलाज",prev:"बचाव",expert:"विशेषज्ञ से कब पूछें",
 plant:"पौधा",conf:"भरोसा",sev:"गंभीरता",note:"यह फोटो से एक AI सुझाव है। छिड़काव से पहले अपने कृषि विज्ञान केंद्र या कृषि अधिकारी से पूछें। दवा के लेबल का पालन करें, दस्ताने और मास्क पहनें।",
 notplant:"इस फोटो में पौधा नहीं दिखा। एक पत्ते के पास जाकर फिर कोशिश करें।",
 healthy:"पौधा स्वस्थ दिखता है",errs:{not_granted:"Plant Doctor के लिए Claude को फोटो जाँचने की अनुमति दें।",rate_limited:"बहुत कोशिशें हो गईं। एक मिनट बाद फिर करें।",image_rejected:"यह फोटो इस्तेमाल नहीं हो सकी। दूसरी फोटो लें।",images_unavailable:"यहाँ फोटो जाँच उपलब्ध नहीं है।",def:"जाँच नहीं हो सकी। इंटरनेट देखकर फिर कोशिश करें।"}}};
const t=()=>UI[lang];
function mk(tag,txt,cls){const e=document.createElement(tag);if(txt!=null)e.textContent=txt;if(cls)e.className=cls;return e}
function list(tag,items){const l=mk(tag);(items||[]).forEach(i=>l.append(mk("li",String(i))));return l}
function chrome(){$("camTxt").textContent=data?t().again:t().cam;$("camSub").textContent=data?"":t().sub;$("camSub").hidden=!!data;
 $("en").setAttribute("aria-pressed",lang==="en");$("hi").setAttribute("aria-pressed",lang==="hi");document.documentElement.lang=lang}
function render(){
 chrome();const o=$("out");o.replaceChildren();o.hidden=false;
 if(url){const im=mk("img");im.id="pic";im.alt="Your plant photo";im.src=url;o.append(im)}
 if(!data.valid){o.append(mk("h2",t().notplant));return}
 const d=data[lang]||data.en,sevCol={none:"#7be08a",mild:"#ffe45c",moderate:"#ff9f43",severe:"#ff5a5f"}[d.severity]||"#ffe45c";
 o.append(mk("p",d.healthy?t().healthy:"","meta"));
 o.append(mk("div",d.disease,"name"));
 o.append(mk("p",t().plant+": "+d.plant,"meta"));
 const pills=mk("div");const p1=mk("span",t().sev+": "+d.severity,"pill");p1.style.background=sevCol;
 const p2=mk("span",t().conf+": "+d.confidence,"pill");p2.style.background="#fff";pills.append(p1,p2);o.append(pills);
 o.append(mk("h2",t().sym),list("ul",d.symptoms));
 const c=mk("div",null,"cure");c.append(mk("h2",t().cure),list("ol",d.cure));o.append(c);
 o.append(mk("h2",t().prev),list("ul",d.prevention));
 o.append(mk("h2",t().expert),mk("p",d.expert,"sub"),mk("small",t().note));
}
function say(msg,load){const o=$("out");o.hidden=false;o.replaceChildren();
 if(url){const im=mk("img");im.id="pic";im.alt="Your plant photo";im.src=url;o.append(im);im.after&&0}
 const w=mk("div",null,load?"load":"");if(load)w.append(mk("div",null,"spin"));w.append(mk("p",msg,"sub"));w.style.marginTop="14px";o.append(w)}
const API="https://YOUR-WORKER.YOUR-SUBDOMAIN.workers.dev";
async function toJpeg(file){const b=await createImageBitmap(file);const k=Math.min(1,1280/Math.max(b.width,b.height));
 const cv=document.createElement("canvas");cv.width=Math.round(b.width*k);cv.height=Math.round(b.height*k);
 cv.getContext("2d").drawImage(b,0,0,cv.width,cv.height);return cv.toDataURL("image/jpeg",0.82).split(",")[1]}
async function diagnose(file){
 if(!file)return;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(file);data=null;chrome();
 ctl&&ctl.abort();ctl=new AbortController();say(t().think,true);
 try{const image=await toJpeg(file);
  const res=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({image}),signal:ctl.signal});
  if(res.status===429)throw {code:"rate_limited"};if(!res.ok)throw {code:"x"};
  const r=await res.json();
  if(!r||typeof r!=="object"||(r.valid!==false&&!r.en))throw {code:"x"};
  data=r;render()}
 catch(e){if(e&&e.name==="AbortError")return;say(t().errs[e&&e.code]||t().errs.def)}
}
$("shot").onchange=e=>{diagnose(e.target.files[0]);e.target.value=""};
$("pick").onchange=e=>{diagnose(e.target.files[0]);e.target.value=""};
for(const l of ["en","hi"])$(l).onclick=()=>{lang=l;chrome();if(data)render()};
chrome();
if(API.includes("YOUR-WORKER"))$("notice").hidden=false;
</script>
</body></html>
